<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" fill="none">
  <defs>
    <linearGradient id="core-tensor-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow-indigo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- el8-stage: shared halo + floor shadow so every illustration sits the same way -->
  <defs>
    <radialGradient id="el8-stage-halo-ai" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="el8-stage-floor-ai" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <g class="el8-stage" aria-hidden="true">
    <ellipse cx="60" cy="45" rx="57.6" ry="45" fill="url(#el8-stage-halo-ai)" />
    <ellipse cx="60" cy="84.6" rx="40.8" ry="4.5" fill="url(#el8-stage-floor-ai)" />
  </g>


  <!-- Neural Matrix Synapse Cables -->
  <g stroke="#6366f1" stroke-width="1.5" opacity="0.6">
    <line x1="22" y1="22" x2="60" y2="14" />
    <line x1="22" y1="22" x2="60" y2="45" />
    <line x1="22" y1="68" x2="60" y2="45" />
    <line x1="22" y1="68" x2="60" y2="76" />
    <line x1="60" y1="14" x2="98" y2="28" stroke="#818cf8" />
    <line x1="60" y1="45" x2="98" y2="28" stroke="#818cf8" />
    <line x1="60" y1="45" x2="98" y2="62" stroke="#818cf8" />
    <line x1="60" y1="76" x2="98" y2="62" stroke="#818cf8" />
  </g>

  <!-- Active Data Signal Pulse Nodes Along Lines -->
  <circle cx="41" cy="18" r="2.5" fill="#38bdf8" />
  <circle cx="41" cy="56" r="2.5" fill="#a855f7" />
  <circle cx="79" cy="21" r="2.5" fill="#38bdf8" />

  <!-- Neural Layer 1 (Input Nodes Left) -->
  <circle cx="22" cy="22" r="7" fill="#090a10" stroke="#6366f1" stroke-width="2" />
  <circle cx="22" cy="22" r="3" fill="#6366f1" />
  <circle cx="22" cy="68" r="7" fill="#090a10" stroke="#6366f1" stroke-width="2" />
  <circle cx="22" cy="68" r="3" fill="#6366f1" />

  <!-- Neural Layer 2 (Hidden Layer Nodes Middle) -->
  <circle cx="60" cy="14" r="7" fill="#090a10" stroke="#818cf8" stroke-width="2" />
  <circle cx="60" cy="14" r="3" fill="#818cf8" />
  <circle cx="60" cy="76" r="7" fill="#090a10" stroke="#818cf8" stroke-width="2" />
  <circle cx="60" cy="76" r="3" fill="#818cf8" />

  <!-- Oversized Core Processing Tensor Hub (Center) -->
  <circle cx="60" cy="45" r="13" fill="#090a10" stroke="#818cf8" stroke-width="1.5" />
  <circle cx="60" cy="45" r="9" fill="url(#core-tensor-grad)" stroke="#ffffff" stroke-width="1.8" filter="url(#glow-indigo)" />
  <circle cx="60" cy="45" r="3" fill="#ffffff" />

  <!-- Neural Layer 3 (Output Nodes Right) -->
  <circle cx="98" cy="28" r="7" fill="#090a10" stroke="#c084fc" stroke-width="2" />
  <circle cx="98" cy="28" r="3" fill="#c084fc" />
  <circle cx="98" cy="62" r="7" fill="#090a10" stroke="#c084fc" stroke-width="2" />
  <circle cx="98" cy="62" r="3" fill="#c084fc" />
</svg>
