<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" fill="none">
  <defs>
    <linearGradient id="db-body-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="shield-face-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 3 Tiered Database Cylinders -->
  <g transform="translate(10, 6)">
    <!-- Cylinder 3 (Bottom) -->
    <path d="M 8 46 C 8 38, 64 38, 64 46 L 64 58 C 64 66, 8 66, 8 58 Z" fill="url(#db-body-grad)" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
    <ellipse cx="36" cy="46" rx="28" ry="8" fill="#38bdf840" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="20" cy="54" r="2" fill="#34d399" />
    <circle cx="27" cy="54" r="2" fill="#38bdf8" />

    <!-- Cylinder 2 (Middle) -->
    <path d="M 8 26 C 8 18, 64 18, 64 26 L 64 38 C 64 46, 8 46, 8 38 Z" fill="url(#db-body-grad)" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <ellipse cx="36" cy="26" rx="28" ry="8" fill="#38bdf850" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="20" cy="34" r="2" fill="#34d399" />
    <circle cx="27" cy="34" r="2" fill="#38bdf8" />

    <!-- Cylinder 1 (Top) -->
    <path d="M 8 6 C 8 -2, 64 -2, 64 6 L 64 18 C 64 26, 8 26, 8 18 Z" fill="url(#db-body-grad)" stroke="#38bdf8" stroke-width="1.5" />
    <ellipse cx="36" cy="6" rx="28" ry="8" fill="#38bdf870" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="20" cy="14" r="2" fill="#34d399" />
    <circle cx="27" cy="14" r="2" fill="#38bdf8" />
  </g>

  <!-- Hardened Security Shield Overlay (Foreground Right) -->
  <g transform="translate(64, 20)">
    <path d="M 24 0 L 44 9 V 28 C 44 42, 24 52, 24 52 C 24 52, 4 42, 4 28 V 9 Z" fill="url(#shield-face-grad)" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow-cyan)" />
    <!-- Inner Shield Grid Rim -->
    <path d="M 24 5 L 39 12 V 27 C 39 38, 24 46, 24 46 C 24 46, 9 38, 9 27 V 12 Z" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 2" fill="none" opacity="0.6" />
    <!-- Encrypted Keyhole Core -->
    <circle cx="24" cy="22" r="4.5" fill="#38bdf8" />
    <path d="M 22 24 L 26 24 L 27 32 L 21 32 Z" fill="#38bdf8" />
  </g>
</svg>
