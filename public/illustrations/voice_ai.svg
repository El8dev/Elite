<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" fill="none">
  <defs>
    <linearGradient id="mic-body-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="mic-grille-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="eq-bar-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow-mic" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Audio Spectrum Equalizer Bars -->
  <g opacity="0.45">
    <rect x="18" y="42" width="4" height="24" rx="2" fill="url(#eq-bar-grad)" />
    <rect x="26" y="32" width="4" height="44" rx="2" fill="url(#eq-bar-grad)" />
    <rect x="34" y="24" width="4" height="56" rx="2" fill="url(#eq-bar-grad)" />
    <rect x="82" y="24" width="4" height="56" rx="2" fill="url(#eq-bar-grad)" />
    <rect x="90" y="32" width="4" height="44" rx="2" fill="url(#eq-bar-grad)" />
    <rect x="98" y="42" width="4" height="24" rx="2" fill="url(#eq-bar-grad)" />
  </g>

  <!-- Outer Concentric Sound Waves -->
  <path d="M 28 46 C 28 28, 42 16, 60 16 C 78 16, 92 28, 92 46" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 4" opacity="0.6" />
  <path d="M 18 46 C 18 20, 36 6, 60 6 C 84 6, 102 20, 102 46" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.35" />

  <!-- Studio Microphone Capsule Body -->
  <rect x="46" y="16" width="28" height="42" rx="14" fill="url(#mic-body-grad)" stroke="#ffffff" stroke-width="1.5" filter="url(#glow-mic)" />

  <!-- Metallic Grille Mesh Lines -->
  <rect x="48" y="18" width="24" height="20" rx="10" fill="url(#mic-grille-grad)" opacity="0.35" />
  <line x1="46" y1="28" x2="74" y2="28" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
  <line x1="46" y1="36" x2="74" y2="36" stroke="#ffffff" stroke-width="1.2" opacity="0.5" />
  <line x1="60" y1="18" x2="60" y2="40" stroke="#ffffff" stroke-width="1.2" opacity="0.4" />

  <!-- Gold Accent Ring -->
  <rect x="46" y="38" width="28" height="3" fill="#fbbf24" opacity="0.9" />

  <!-- U-Mount Bracket & Screws -->
  <path d="M 38 42 C 38 62, 50 68, 60 68 C 70 68, 82 62, 82 42" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" fill="none" />
  <circle cx="38" cy="42" r="3" fill="#cbd5e1" stroke="#475569" stroke-width="1" />
  <circle cx="82" cy="42" r="3" fill="#cbd5e1" stroke="#475569" stroke-width="1" />

  <!-- Stand Post & Solid Base -->
  <line x1="60" y1="68" x2="60" y2="82" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
  <ellipse cx="60" cy="83" rx="22" ry="4" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2" />

  <!-- Status Beacon LED Dot -->
  <circle cx="60" cy="48" r="2.5" fill="#38bdf8" />
  <circle cx="60" cy="48" r="5" fill="#38bdf8" opacity="0.4" />
</svg>
