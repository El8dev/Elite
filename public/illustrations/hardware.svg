<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" fill="none">
  <defs>
    <linearGradient id="chip-body-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090a10" />
    </linearGradient>
    <linearGradient id="gold-pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow-lime" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- el8-stage: shared halo + floor shadow so every illustration sits the same way -->
  <defs>
    <radialGradient id="el8-stage-halo-hardware" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.30" />
      <stop offset="60%" stop-color="#84cc16" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#84cc16" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="el8-stage-floor-hardware" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <g class="el8-stage" aria-hidden="true">
    <ellipse cx="60" cy="45" rx="57.6" ry="45" fill="url(#el8-stage-halo-hardware)" />
    <ellipse cx="60" cy="84.6" rx="40.8" ry="4.5" fill="url(#el8-stage-floor-hardware)" />
  </g>


  <!-- PCB Board Circuit Traces -->
  <g stroke="#84cc16" stroke-width="1.8" opacity="0.6" stroke-linecap="round">
    <path d="M 8 18 L 34 18 M 8 45 L 34 45 M 8 72 L 34 72" />
    <path d="M 86 18 L 112 18 M 86 45 L 112 45 M 86 72 L 112 72" />
    <path d="M 42 6 L 42 22 M 60 6 L 60 22 M 78 6 L 78 22" />
    <path d="M 42 68 L 42 84 M 60 68 L 60 84 M 78 68 L 78 84" />
  </g>

  <!-- PCB Trace Vias -->
  <circle cx="8" cy="18" r="2.5" fill="#090a10" stroke="#84cc16" stroke-width="1.5" />
  <circle cx="8" cy="45" r="2.5" fill="#090a10" stroke="#84cc16" stroke-width="1.5" />
  <circle cx="8" cy="72" r="2.5" fill="#090a10" stroke="#84cc16" stroke-width="1.5" />
  <circle cx="112" cy="18" r="2.5" fill="#090a10" stroke="#84cc16" stroke-width="1.5" />
  <circle cx="112" cy="45" r="2.5" fill="#090a10" stroke="#84cc16" stroke-width="1.5" />
  <circle cx="112" cy="72" r="2.5" fill="#090a10" stroke="#84cc16" stroke-width="1.5" />

  <!-- Microchip Gold Pins (16 Pins Header) -->
  <g fill="url(#gold-pin)">
    <!-- Left Pins -->
    <rect x="28" y="26" width="8" height="4" rx="1" />
    <rect x="28" y="36" width="8" height="4" rx="1" />
    <rect x="28" y="46" width="8" height="4" rx="1" />
    <rect x="28" y="56" width="8" height="4" rx="1" />
    <!-- Right Pins -->
    <rect x="84" y="26" width="8" height="4" rx="1" />
    <rect x="84" y="36" width="8" height="4" rx="1" />
    <rect x="84" y="46" width="8" height="4" rx="1" />
    <rect x="84" y="56" width="8" height="4" rx="1" />
    <!-- Top Pins -->
    <rect x="40" y="16" width="4" height="8" rx="1" />
    <rect x="50" y="16" width="4" height="8" rx="1" />
    <rect x="66" y="16" width="4" height="8" rx="1" />
    <rect x="76" y="16" width="4" height="8" rx="1" />
    <!-- Bottom Pins -->
    <rect x="40" y="66" width="4" height="8" rx="1" />
    <rect x="50" y="66" width="4" height="8" rx="1" />
    <rect x="66" y="66" width="4" height="8" rx="1" />
    <rect x="76" y="66" width="4" height="8" rx="1" />
  </g>

  <!-- MCU Chip Package Body -->
  <rect x="34" y="22" width="52" height="46" rx="5" fill="url(#chip-body-grad)" stroke="#84cc16" stroke-width="2" filter="url(#glow-lime)" />
  <!-- Silicon Heat Spreader Die Ring -->
  <rect x="42" y="28" width="36" height="34" rx="3" fill="#84cc1618" stroke="#84cc16" stroke-width="1.2" />

  <!-- Pin 1 Index Dot -->
  <circle cx="39" cy="27" r="2" fill="#84cc16" />

  <!-- Engraved Chip Markings -->
  <text x="60" y="44" fill="#ffffff" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">EL8 MCU</text>
  <text x="60" y="54" fill="#a3e635" font-size="7" font-family="monospace" text-anchor="middle">32-BIT RISC</text>
</svg>
