<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" fill="none">
  <defs>
    <linearGradient id="chart-area-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="bar-col-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="bar-col-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Axis & Dotted Grid -->
  <line x1="15" y1="76" x2="112" y2="76" stroke="#ffffff30" stroke-width="1.5" />
  <line x1="15" y1="12" x2="15" y2="76" stroke="#ffffff30" stroke-width="1.5" />
  <line x1="15" y1="54" x2="112" y2="54" stroke="#ffffff15" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="15" y1="32" x2="112" y2="32" stroke="#ffffff15" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Shaded Area Under Trend Curve -->
  <path d="M 22 56 L 42 38 L 64 50 L 86 24 L 106 14 L 106 76 L 22 76 Z" fill="url(#chart-area-grad)" />

  <!-- 3D-Effect Bar Columns -->
  <rect x="23" y="46" width="12" height="30" rx="3" fill="url(#bar-col-1)" stroke="#6ee7b7" stroke-width="0.8" opacity="0.8" />
  <rect x="43" y="32" width="12" height="44" rx="3" fill="url(#bar-col-2)" stroke="#6ee7b7" stroke-width="0.8" />
  <rect x="63" y="44" width="12" height="32" rx="3" fill="url(#bar-col-1)" stroke="#6ee7b7" stroke-width="0.8" opacity="0.8" />
  <rect x="83" y="20" width="12" height="56" rx="3" fill="url(#bar-col-2)" stroke="#6ee7b7" stroke-width="0.8" />

  <!-- Smooth Spline Growth Trend Line -->
  <path d="M 20 58 Q 32 44 43 36 T 64 50 T 85 24 T 108 12" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-emerald)" />

  <!-- Data Point Glowing Ring Nodes -->
  <circle cx="43" cy="36" r="3.5" fill="#064e3b" stroke="#34d399" stroke-width="2" />
  <circle cx="64" cy="50" r="3.5" fill="#064e3b" stroke="#34d399" stroke-width="2" />
  <circle cx="85" cy="24" r="3.5" fill="#064e3b" stroke="#6ee7b7" stroke-width="2" />

  <!-- Peak Target Arrow Pin + Callout Tag -->
  <g transform="translate(100, 4)">
    <circle cx="8" cy="8" r="6" fill="#10b981" filter="url(#glow-emerald)" />
    <path d="M 5 8 L 8 5 L 11 8 M 8 5 L 8 11" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
