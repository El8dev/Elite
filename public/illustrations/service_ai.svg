<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 90" fill="none">
  <defs>
    <linearGradient id="ai-serv-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow-purple-serv" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Orbital Grid Rings -->
  <circle cx="65" cy="45" r="32" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.5" />
  <circle cx="65" cy="45" r="24" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />

  <!-- Glowing Core Sphere -->
  <circle cx="65" cy="45" r="16" fill="url(#ai-serv-core)" filter="url(#glow-purple-serv)" />
  <circle cx="65" cy="45" r="6" fill="#ffffff" />

  <!-- Directional Data Channels (4 Cardinal Axis Pins) -->
  <line x1="22" y1="45" x2="38" y2="45" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="92" y1="45" x2="108" y2="45" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="65" y1="5" x2="65" y2="20" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />
  <line x1="65" y1="70" x2="65" y2="85" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />

  <!-- Endpoint Data Nodes -->
  <circle cx="18" cy="45" r="3.5" fill="#38bdf8" />
  <circle cx="112" cy="45" r="3.5" fill="#38bdf8" />
  <circle cx="65" cy="4" r="3.5" fill="#8b5cf6" />
  <circle cx="65" cy="86" r="3.5" fill="#8b5cf6" />
</svg>
