<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 90" fill="none">
  <defs>
    <linearGradient id="uiux-card-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090a10" />
    </linearGradient>
    <filter id="glow-pink-serv" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Card: Screen Wireframe -->
  <rect x="12" y="12" width="48" height="66" rx="7" fill="url(#uiux-card-grad)" stroke="#ec4899" stroke-width="1.8" />
  <rect x="20" y="20" width="32" height="8" rx="3" fill="#ec489940" />
  <rect x="20" y="34" width="22" height="5" rx="2.5" fill="#ffffff60" />
  <rect x="20" y="45" width="32" height="24" rx="4" fill="#f43f5e25" stroke="#f43f5e" stroke-width="1.2" />

  <!-- Right Widget 1: Interactive Toggle Switch -->
  <g transform="translate(68, 14)">
    <rect x="0" y="0" width="50" height="28" rx="7" fill="url(#uiux-card-grad)" stroke="#f472b6" stroke-width="1.5" />
    <rect x="6" y="6" width="38" height="16" rx="8" fill="#ec4899" />
    <circle cx="34" cy="14" r="6" fill="#ffffff" filter="url(#glow-pink-serv)" />
  </g>

  <!-- Right Widget 2: Custom Range Slider -->
  <g transform="translate(68, 48)">
    <rect x="0" y="0" width="50" height="30" rx="7" fill="url(#uiux-card-grad)" stroke="#ec4899" stroke-width="1.5" />
    <line x1="8" y1="15" x2="42" y2="15" stroke="#ffffff30" stroke-width="4" stroke-linecap="round" />
    <line x1="8" y1="15" x2="28" y2="15" stroke="#ec4899" stroke-width="4" stroke-linecap="round" />
    <circle cx="28" cy="15" r="6" fill="#ffffff" stroke="#ec4899" stroke-width="2" filter="url(#glow-pink-serv)" />
  </g>
</svg>
